name: Ruby CI and export kit

# Public repo: holds NO deploy credentials. Dispatches scaffold's
# export-kit-release.yml, which builds this repo's export kit at this exact
# SHA and ships it to kits.noisedeck.app. See scaffold
# docs/runbook/export-kits.md.

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Inert documentation does not build. README.md stays in: the gem ships
    # it and test/test_packaging.rb checks it.
    paths:
      - '**'
      - '!*.md'
      - '!docs/**'
      - '!.github/ISSUE_TEMPLATE/**'
      - '!.github/PULL_REQUEST_TEMPLATE*'
      - '!.github/CODEOWNERS'
      - '!.editorconfig'
      - 'README.md'
  pull_request:
    paths:
      - '**'
      - '!*.md'
      - '!docs/**'
      - '!.github/ISSUE_TEMPLATE/**'
      - '!.github/PULL_REQUEST_TEMPLATE*'
      - '!.github/CODEOWNERS'
      - '!.editorconfig'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: export-kit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / ${{ matrix.os }}
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby: ['3.2', '3.3', '3.4', '4.0']
        include:
          - os: macos-latest
            ruby: '4.0'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Standalone tests, including archive installation and C locale
        env:
          NOISEMAKER_CPU_DIR: /no-oracle-in-standalone-tests
          LC_ALL: C
        run: bundle exec rake test

  parity:
    name: Pinned JavaScript parity and integration
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Read oracle revision
        id: oracle
        run: ruby -rjson -e 'puts "revision=#{JSON.parse(File.read("scripts/oracle-lock.json")).fetch("revision")}"' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: noisefactorllc/noisemaker-for-cpu
          ref: ${{ steps.oracle.outputs.revision }}
          path: oracle
          persist-credentials: false
      - name: Install video test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Required integration tests
        env:
          NOISEMAKER_CPU_DIR: ${{ github.workspace }}/oracle
          NOISEMAKER_REQUIRE_ORACLE: '1'
          LC_ALL: C
        run: bundle exec rake test
      - name: All 205 effects, exact RGBA8 comparison
        env:
          NOISEMAKER_CPU_DIR: ${{ github.workspace }}/oracle
        run: bundle exec ruby scripts/parity.rb

  changes:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.paths.outputs.release }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check existing export-kit publication paths
        id: paths
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          ruby -ropen3 -e '
            before = ENV.fetch("BEFORE", "")
            args = before.match?(/\A[0-9a-f]{40}\z/) && before != "0" * 40 ?
              ["diff", "--name-only", before, ENV.fetch("GITHUB_SHA"), "--"] : ["ls-files"]
            out, status = Open3.capture2("git", *args)
            abort "could not inspect changed files" unless status.success?
            changed = out.lines.any? { |path| path.strip.match?(%r{\A(?:export-kit/|lib/|exe/noisemaker-rb$|LICENSE$|\.github/workflows/export-kit\.yml$)}) }
            puts "release=#{ENV["EVENT_NAME"] == "workflow_dispatch" || changed}"
          ' >> "$GITHUB_OUTPUT"

  dispatch:
    needs: [test, parity, changes]
    if: github.event_name != 'pull_request' && needs.changes.outputs.release == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Mint scaffold-dispatch token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liy6T6BW0BXuZRzx
          private-key: ${{ secrets.EHSRE_APP_PRIVATE_KEY }}
          owner: noisefactorllc
          repositories: scaffold

      - name: Dispatch export-kit-release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run export-kit-release.yml \
            --repo noisefactorllc/scaffold \
            --ref main \
            -f kit=ruby \
            -f sha=${{ github.sha }}
